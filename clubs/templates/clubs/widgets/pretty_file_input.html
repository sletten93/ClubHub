{% load tr %}
{% if widget.is_initial %}
<div class="d-flex align-items-center mb-2" data-current-wrapper>
    <img src="{{ widget.file_url }}" alt="" class="img-thumbnail bg-white me-2" style="max-height:96px" data-current-image>
    <span class="small text-muted text-break">{{ widget.display_filename }}</span>
</div>
{% else %}
<img data-current-image class="img-thumbnail bg-white d-none mb-2" style="max-height:96px" alt="">
{% endif %}
<div class="ch-file-row">
    {% if widget.is_initial %}
    <button type="button" class="btn btn-sm btn-outline-danger me-2" data-remove-image="{{ widget.name }}">{% tr 'Ta bort' %}</button>
    {% endif %}
    <span class="ch-file">
        <input type="{{ widget.type }}" name="{{ widget.name }}" data-preview-input{% include "django/forms/widgets/attrs.html" %}>
        <span class="ch-file-button">{% tr 'Välj fil' %}</span>
    </span>
    <span class="small text-muted ms-2" data-file-name></span>
</div>
