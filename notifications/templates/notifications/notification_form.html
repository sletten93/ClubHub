{% extends "base.html" %}
{% load tr %}
{% block title %}{% tr "Nytt meddelande" "Meddelanden" %}{% endblock %}
{% block content %}
<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">{% tr "Nytt meddelande" "Meddelanden" %} (e-post)</h1>
</div>
<div class="row">
    <div class="col-lg-8">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 fw-bold text-primary">{% tr "Nytt meddelande" "Meddelanden" %}</h6>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">{% tr "Skicka" "Meddelanden" %}</button>
                    <a href="{{ cancel_url }}" class="btn btn-secondary">{% tr "Avbryt" %}</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
