{% load tr %}
<div class="ch-page-nav">
    {% if prev_page_url %}
    <a class="ch-page-arrow" href="{{ prev_page_url }}" aria-label="{% tr "Föregående sida" "Allmän" %}">
        <i class="fas fa-chevron-left fa-sm"></i>
    </a>
    {% else %}
    <span class="ch-page-arrow disabled"><i class="fas fa-chevron-left fa-sm"></i></span>
    {% endif %}
    <span class="text-dark ch-page-number">{{ page_obj.number }}</span>
    {% if next_page_url %}
    <a class="ch-page-arrow" href="{{ next_page_url }}" aria-label="{% tr "Nästa sida" "Allmän" %}">
        <i class="fas fa-chevron-right fa-sm"></i>
    </a>
    {% else %}
    <span class="ch-page-arrow disabled"><i class="fas fa-chevron-right fa-sm"></i></span>
    {% endif %}
</div>
