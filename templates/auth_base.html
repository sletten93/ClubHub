{% load static tr %}<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}ClubHub{% endblock %}</title>
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="{% static 'css/clubhub.css' %}" rel="stylesheet">
    {% if theme %}
    <style>
        .bg-gradient-primary {
            background-color: {{ theme.primary }};
            background-image: linear-gradient(180deg, {{ theme.primary }} 10%, {{ theme.primary_active }} 100%);
            background-size: cover;
        }
        .btn-primary {
            background-color: {{ theme.primary }};
            border-color: {{ theme.primary }};
            color: {{ theme.on_primary }};
        }
        .btn-primary:hover {
            background-color: {{ theme.primary_hover }};
            border-color: {{ theme.primary_hover }};
            color: {{ theme.on_primary }};
        }
        a { color: {{ theme.link }}; }
    </style>
    {% endif %}
</head>

<body class="bg-gradient-primary">
<div class="container">
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show mt-3">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Stäng">
            </button>
        </div>
        {% endfor %}
    {% endif %}
    {% block auth_content %}{% endblock %}
</div>

<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'js/clubhub.js' %}"></script>
</body>

</html>
